<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spoiler Alert</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="tape">⚠ SPOILER ALERT ⚠</div>
      <label class="switch" data-i18n-title="toggleTitle">
        <input type="checkbox" id="enabled" />
        <span></span>
      </label>
    </header>

    <form id="add-form">
      <input id="keyword" type="text" data-i18n-placeholder="keywordPlaceholder" autocomplete="off" />
      <button type="submit" data-i18n="add"></button>
    </form>
    <p class="hint" data-i18n="hint"></p>

    <ul id="list"></ul>
    <p id="empty" class="empty" data-i18n="empty"></p>

    <script src="popup.js"></script>
  </body>
</html>
